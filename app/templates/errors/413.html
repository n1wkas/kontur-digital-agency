{% extends "base.html" %}

{% block title %}Файл слишком большой — Контур{% endblock %}

{% block content %}

  <div class="container">
    <p class="error-page__code">413</p>
    <h1 class="page-title">Файл слишком большой</h1>

    <p>
      <a class="btn btn--primary" href="{{ url_for('public.index') }}">На главную</a>
    </p>
  </div>
</section>
{% endblock %}
